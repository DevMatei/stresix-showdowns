# strapi and payload have no official images, so their Dockerfiles get built
# here and pushed to ghcr. the test boxes just pull them.
name: images

on:
  push:
    branches: [main]
    paths: ["strapi/**", "payload/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [strapi, payload]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/devmatei/showdown-${{ matrix.app }}:latest
          labels: org.opencontainers.image.source=https://github.com/DevMatei/stresix-showdowns
