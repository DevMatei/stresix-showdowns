# strapi + postgres. strapi has no official image, so this is a plain
# create-strapi-app project built in production mode, default config.
# src/index.js adds the 10 test posts and lets the public role read them.
# tested endpoint: GET /api/posts?pagination[pageSize]=10
services:
  strapi:
    build: .
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "1337"
      APP_KEYS: showdownkey1,showdownkey2
      API_TOKEN_SALT: showdown-salt
      ADMIN_JWT_SECRET: showdown-admin-jwt
      JWT_SECRET: showdown-jwt
      TRANSFER_TOKEN_SALT: showdown-transfer
      ENCRYPTION_KEY: showdown-encryption
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "strapi"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db:
